services:
  hls-mcp:
    build: .
    image: hls-mcp:latest
    container_name: hls-mcp
    restart: unless-stopped
    ports:
      - "8004:8004"
    volumes:
      # Where hls.db and its vectors live on the host. Set HLS_DATA_DIR in the
      # host .env; it must be writable by the user running compose, because
      # embed_db.py writes the semantic index into the same database.
      - ${HLS_DATA_DIR:-/home/dh/hls_data}:/data
      - /home/dh/hls/HLS:/src:ro
    environment:
      - PYTHONUNBUFFERED=1
      - HLS_SRC_CSV=/src/hls_articles.csv
      - HLS_OUT_DB=/data/hls.db
      # The server answers on its *public* path so nginx can proxy_pass without
      # rewriting. Change this together with the nginx location block; the two
      # must agree exactly or every request 404s.
      - HLS_HTTP_PATH=${HLS_HTTP_PATH:-/mcp/hls/mcp}
      # Semantic search. The key is only needed to embed incoming queries — the
      # article vectors are already in hls.db. GPUStack is reachable from inside
      # the UniBE network only.
      - GPUSTACK_BASE_URL=${GPUSTACK_BASE_URL:-https://gpustack.unibe.ch/v1}
      - GPUSTACK_API_KEY=${GPUSTACK_API_KEY:-}
      - HLS_EMBED_MODEL=${HLS_EMBED_MODEL:-qwen3-embedding-0.6b}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('localhost', 8004), 3).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
